      <h2>参考文献</h2>
      <p>The Univalent Foundations Program, <a href="https://homotopytypetheory.org/book/"><em>Homotopy Type Theory: Univalent Foundations of Mathematics</em></a>. 基本的な文法は第1章と付録A, 生成子と帰納法は第5章, 高次帰納型は第6章, 切詰レベルは第7.1節, 切詰は第7.3節を参照. 本稿では, サイズと保存の条件を区別するため, universeと関数型の扱いを段階に分けている.</p>
      <p>Ingo Blechschmidt, <a href="https://arxiv.org/abs/2111.03685"><em>Using the internal language of toposes in algebraic geometry</em></a>.</p>
    </section></template><template id="definition-note-exponentiable-type"><div class="annotation-excerpt"><p>小さな型 <span class="math-inline"><svg role="img" aria-label="X" class="typst-frame" style="overflow: visible; width: 0.879em; height: 0.683em;" viewBox="0 0 10.548 8.196" width="10.548pt" height="8.196pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g class="typst-text" transform="matrix(1 0 0 -1 0 8.196)"><use xlink:href="#gA1C868C4B206E33DF61B2DBFCBA03B85" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g></g></svg></span> が <strong>exponentiable</strong> であるとは, 小さな型 <span class="math-inline"><svg role="img" aria-label="A" class="typst-frame" style="overflow: visible; width: 0.75em; height: 0.683em;" viewBox="0 0 9 8.196" width="9pt" height="8.196pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g class="typst-text" transform="matrix(1 0 0 -1 0 8.196)"><use xlink:href="#g40A63673E73C184AD4D02763AC2D1101" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g></g></svg></span> に対し, <span class="math-inline"><svg role="img" aria-label="x:X" class="typst-frame" style="overflow: visible; width: 2.2845555555555555em; height: 0.683em;" viewBox="0 0 27.414666666666665 8.196" width="27.414666666666665pt" height="8.196pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g class="typst-text" transform="matrix(1 0 0 -1 0 8.196)"><use xlink:href="#g6FC8F76D792038750AC0DE0CC8E27901" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 10.197333333333333 8.196)"><use xlink:href="#gE8431B6F6C80590299677CF5CDE5BDF0" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 16.866666666666667 8.196)"><use xlink:href="#gA1C868C4B206E33DF61B2DBFCBA03B85" x="0" y="0"
