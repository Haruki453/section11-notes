      <p><span class="math-inline"><svg role="img" aria-label="cal(E)" class="typst-frame" style="overflow: visible; width: 0.613em; height: 0.683em;" viewBox="0 0 7.356 8.196" width="7.356pt" height="8.196pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g class="typst-text" transform="matrix(1 0 0 -1 0 8.196)"><use xlink:href="#g434F2C5400AA73EFAC2A7777F9662623" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g></g></svg></span> を pretopos, <span class="math-inline"><svg role="img" aria-label="X=⟦Gamma⟧" class="typst-frame" style="overflow: visible; width: 3.6635555555555555em; height: 0.683em;" viewBox="0 0 43.962666666666664 8.196" width="43.962666666666664pt" height="8.196pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g class="typst-text" transform="matrix(1 0 0 -1 0 8.196)"><use xlink:href="#gA1C868C4B206E33DF61B2DBFCBA03B85" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 13.881333333333334 8.196)"><use xlink:href="#g22FE5AD706A859FAD2ADDB0CCE27F744" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 26.550666666666668 8.196)"><use xlink:href="#gBFBE0DAE92CAA96ED9BD59A3F401FDA" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 31.54266666666667 8.196)"><use xlink:href="#g8DB14B33AE9E269E004989900CEE32CE" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g><g class="typst-text" transform="matrix(1 0 0 -1 39.04266666666666 8.196)"><use xlink:href="#gBEC9B244D7CB0EF4E0A4F720D259AA29" x="0" y="0" fill="#000000" fill-rule="nonzero"/></g></g></svg></span> とする. 型 <span class="math-inline"><svg role="img" aria-label="A" class="typst-frame" style="overflow: visible; width: 0.75em; height: 0.683em;" viewBox="0 0 9 8.196" width="9pt" height="8.196pt" xmlns="http://
